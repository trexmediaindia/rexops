name: Deploy

# Ships main to the production server after CI passes on it, or on demand from the Actions tab.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     server IP or hostname
#   DEPLOY_USER     SSH user that ran scripts/server-setup.sh (e.g. root or ubuntu)
#   DEPLOY_SSH_KEY  private key whose public half is in that user's ~/.ssh/authorized_keys
# The app's own secrets never pass through GitHub: they live in /opt/rexops/.env.production
# on the server, written once by scripts/server-setup.sh.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
      APP_DIR: /opt/rexops
    steps:
      - name: Check deploy settings
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ "$HAS_DEPLOY_KEY" != "true" ]; then
            echo "::error::Set DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY in the repository secrets. See docs/runbooks/deploy.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The commit CI just passed, not whatever main is by the time this starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy code to the server
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude 'node_modules/' --exclude '.data/' \
            --exclude '.env' --exclude '.env.*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/rexops
          if [ ! -f .env.production ]; then
            echo "::error::/opt/rexops/.env.production is missing. Run scripts/server-setup.sh on the server first."
            exit 1
          fi
          compose() { docker compose --env-file .env.production -f docker-compose.prod.yml "$@"; }
          compose build
          compose up -d --remove-orphans
          echo "Waiting for the API to report healthy..."
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(compose ps -q api)" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then echo "API is healthy."; break; fi
            if [ "$i" = 60 ]; then
              echo "::error::API did not become healthy."; compose logs --tail 80 api migrate; exit 1
            fi
            sleep 5
          done
          docker image prune -f >/dev/null
          compose ps
          REMOTE
