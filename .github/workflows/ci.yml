name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rexops
          POSTGRES_PASSWORD: rexops
          POSTGRES_DB: rexops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rexops -d rexops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      API_PORT: 3001
      API_URL: http://localhost:3001
      WEB_URL: http://localhost:5173
      DATABASE_URL: postgres://rexops:rexops@localhost:5432/rexops_test
      DATABASE_URL_UNPOOLED: postgres://rexops:rexops@localhost:5432/rexops_test
      BETTER_AUTH_SECRET: test-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      REDIS_URL: redis://localhost:6379/1
      OPENFEATURE_PROVIDER: memory
      VITE_API_URL: http://localhost:3001
      VITE_LIVEBLOCKS_AUTH_URL: http://localhost:3001/api/liveblocks-auth
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - run: bun run db:seed
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run check:bundle

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f docker/Dockerfile.api -t rexops-api .
      - run: docker build -f docker/Dockerfile.worker -t rexops-worker .
      - run: docker build -f docker/Dockerfile.web -t rexops-web .
